name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode
        run: pip install -e .

      - name: Run unit & end-to-end tests (zero external deps)
        run: python -m unittest discover -s tests -v

      - name: Smoke test installed thesis-breaker CLI (zero external deps)
        run: |
          thesis-breaker --version
          thesis-breaker demo
          thesis-breaker audit \
            --ibkr examples/ibkr_flex_positions.csv \
            --notes examples/obsidian_vault \
            --earnings examples/earnings_q4_flash.md \
            --format markdown

      - name: Install optional dependencies (PyYAML & pytest) and test
        run: |
          pip install -e ".[dev]"
          pytest -v
          thesis-breaker demo

      - name: Build wheel and verify standalone CLI outside repository
        run: |
          TMP_OUT=$(mktemp -d)
          pip wheel . --no-deps -w "$TMP_OUT/dist"
          pip uninstall -y thesis-breaker
          pip install "$TMP_OUT"/dist/*.whl
          mkdir -p "$TMP_OUT/outside/examples"
          cd "$TMP_OUT/outside"
          thesis-breaker --version
          thesis-breaker demo
